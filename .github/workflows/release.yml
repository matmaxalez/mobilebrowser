name: Release

# Publishes dist/mobile-emulator-v<version>.zip as a GitHub Release.
# Trigger by pushing a tag vX.Y.Z, or run manually (Actions → Release → Run
# workflow): the tag is then created from the manifest version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and check version
        id: version
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          p=$(node -p "require('./package.json').version")
          test "$v" = "$p" || { echo "manifest.json ($v) != package.json ($p)"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != manifest v$v"; exit 1; }
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Mobile Emulator ${{ steps.version.outputs.tag }}
          files: dist/*.zip
          generate_release_notes: true
          body: |
            **Instalacja:** pobierz `mobile-emulator-${{ steps.version.outputs.tag }}.zip`, rozpakuj, otwórz `chrome://extensions`, włącz *Tryb dewelopera* i kliknij *Załaduj rozpakowane*, wskazując rozpakowany folder. Szczegóły w [README](https://github.com/${{ github.repository }}#instalacja).
