<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Mobile Emulator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img src="../icons/icon48.png" alt="" width="28" height="28">
    <div>
      <h1>Mobile Emulator</h1>
      <p class="sub">Widok mobilny stron w tej karcie</p>
    </div>
  </header>

  <section class="card status" id="statusCard">
    <div class="status-text">
      <strong id="statusLabel">Wyłączony</strong>
      <span id="statusDetail">Strona zobaczy telefon, karta zostaje normalna</span>
    </div>
    <label class="switch" title="Włącz / wyłącz (Alt+Shift+M)">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </section>

  <p class="error" id="error" hidden></p>

  <section class="card">
    <label class="field">
      <span>Urządzenie</span>
      <select id="device"></select>
    </label>

    <div id="customBox" class="custom" hidden>
      <div class="row">
        <label class="field"><span>Szerokość</span><input type="number" id="cWidth" min="200" max="3000"></label>
        <label class="field"><span>Wysokość</span><input type="number" id="cHeight" min="200" max="3000"></label>
        <label class="field"><span>DPR</span><input type="number" id="cDpr" min="1" max="5" step="0.125"></label>
      </div>
      <div class="row">
        <label class="field"><span>System</span>
          <select id="cOs"><option value="android">Android</option><option value="ios">iOS</option></select>
        </label>
        <label class="check inline"><input type="checkbox" id="cTablet"> Tablet</label>
      </div>
      <label class="field"><span>Własny User-Agent (opcjonalnie)</span>
        <input type="text" id="cUa" placeholder="puste = automatyczny">
      </label>
    </div>

    <div class="row">
      <div class="field grow">
        <span>Orientacja ekranu</span>
        <div class="seg" role="radiogroup">
          <button type="button" data-orient="portrait" class="active">Pionowo</button>
          <button type="button" data-orient="landscape">Poziomo</button>
        </div>
      </div>
    </div>
    <label class="field" id="viewportField">
      <span>Widok</span>
      <select id="viewport">
        <option value="tab">Cała karta – bez ramki telefonu</option>
        <option value="stretch">Szerokość telefonu, rozciągnięta na kartę</option>
        <option value="device">Dokładny rozmiar telefonu (1:1)</option>
      </select>
    </label>
    <p class="meta" id="deviceMeta"></p>
  </section>

  <section class="card">
    <span class="label">Tryb emulacji</span>
    <label class="mode">
      <input type="radio" name="mode" value="full">
      <div>
        <strong>Pełny (zalecany)</strong>
        <small>Jak tryb urządzenia w DevTools: User-Agent, Client Hints, dotyk, media queries (pointer/hover), ekran telefonu. Chrome pokazuje pasek „rozpoczęto debugowanie”.</small>
      </div>
    </label>
    <label class="mode">
      <input type="radio" name="mode" value="lite">
      <div>
        <strong>Lekki</strong>
        <small>Bez paska debugowania: nagłówki HTTP + podmiana obiektu navigator w JS. CSS media queries dotyku nie zadziałają.</small>
      </div>
    </label>
    <label class="check" id="liteWindowRow"><input type="checkbox" id="liteWindow"> Przenieś kartę do okna o rozmiarze telefonu</label>
    <label class="check"><input type="checkbox" id="inherit"> Nowe karty otwarte z emulowanej karty też emuluj</label>
  </section>

  <footer class="foot">Skrót: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> · <a href="#" id="shortcuts">zmień</a></footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
